name: Build & Test SSBU Amiibo Trainer

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows-and-linux:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Binaries
        run: cmake --build build --config Release

      - name: Run Unit & 500-Game Training Integration Tests
        working-directory: build
        run: ctest -C Release --output-on-failure --verbose

      - name: Run End-to-End CLI Training Verification (500 Games + Spirits)
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./build/Release/ssbu_amiibo_trainer.exe --fighter "Sephiroth" --opponent "Kazuya" --games 500 --archetype aerial --focus aerial --primary-spirit "Galeem" --spirits 20,81,0 --out trained_sephiroth_lv50.bin
            ./build/Release/ssbu_amiibo_trainer.exe --in trained_sephiroth_lv50.bin --inspect
          else
            ./build/ssbu_amiibo_trainer --fighter "Sephiroth" --opponent "Kazuya" --games 500 --archetype aerial --focus aerial --primary-spirit "Galeem" --spirits 20,81,0 --out trained_sephiroth_lv50.bin
            ./build/ssbu_amiibo_trainer --in trained_sephiroth_lv50.bin --inspect
          fi
        shell: bash

      - name: Upload Windows Executable & Sample Trained Amiibo Artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: SSBU-Amiibo-Trainer-Windows-x64
          path: |
            build/Release/ssbu_amiibo_trainer.exe
            trained_sephiroth_lv50.bin
